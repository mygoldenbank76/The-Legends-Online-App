name: Build Android TWA APK

# Trusted Web Activity (TWA) build via Bubblewrap.
# Wraps the live PWA (https://thelegendsonline.social) in a Chrome
# Custom Tab so the rendering engine is REAL Chrome, not WebView.
# This eliminates the WebView/Chrome behavioural divergences (text
# selection magnifier, keyboard handling, viewport quirks) that
# Capacitor cannot avoid because Capacitor uses Android's WebView
# component.
#
# Coexists with the Capacitor build (different packageId), so the
# user can install BOTH APKs on the same device and compare.
#
# First run extracts the keystore SHA256 fingerprint, writes it into
# artifacts/telegram-pwa/public/.well-known/assetlinks.json, and
# auto-commits that file with [skip ci] so neither build re-triggers.
# Without a valid assetlinks.json on the live domain, the TWA shows
# a Chrome URL bar at the top — with it, the URL bar is hidden and
# the app feels truly native.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-android-twa.yml'

permissions:
  contents: write

concurrency:
  group: build-android-twa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & publish TWA APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Bubblewrap requires JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/.android-keystore
          echo "$KEYSTORE_B64" | base64 -d > $HOME/.android-keystore/legends-release.keystore
          echo "ANDROID_KEYSTORE_FILE=$HOME/.android-keystore/legends-release.keystore" >> $GITHUB_ENV

      - name: Extract SHA256 fingerprint from keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SHA256=$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_FILE" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | grep "SHA256:" | head -1 | awk '{print $2}')
          if [ -z "$SHA256" ]; then
            echo "::error::Failed to extract SHA256 fingerprint from keystore"
            exit 1
          fi
          echo "SHA256_FINGERPRINT=$SHA256" >> $GITHUB_ENV
          echo "::notice::SHA256 fingerprint = $SHA256"

      - name: Pre-configure Bubblewrap (skip JDK/SDK prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@latest

      - name: Patch manifest with build version + signing key
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          jq \
            --arg vc "${{ github.run_number }}" \
            --arg vn "1.0.${{ github.run_number }}" \
            --arg ksPath "$ANDROID_KEYSTORE_FILE" \
            --arg ksAlias "$ANDROID_KEY_ALIAS" \
            '.appVersionCode = ($vc|tonumber)
             | .appVersionName = $vn
             | .signingKey = { path: $ksPath, alias: $ksAlias }' \
            twa-manifest.json > /tmp/twa-manifest.patched.json
          mv /tmp/twa-manifest.patched.json ./twa-manifest.json
          cat twa-manifest.json

      - name: Generate TWA Android project from manifest
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p twa-build
          cd twa-build
          # Init non-interactively. Empty stdin in case any prompt remains.
          # --skipPwaValidation avoids network checks against the live PWA.
          bubblewrap init \
            --manifest="${{ github.workspace }}/twa-manifest.json" \
            --skipPwaValidation < /dev/null

      - name: Build signed TWA APK
        working-directory: ${{ runner.temp }}/twa-build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # bubblewrap build prompts for keystore + key password. Feed via stdin.
          printf '%s\n%s\n' "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" \
            | bubblewrap build --skipPwaValidation

      - name: Locate, verify and rename APK
        run: |
          APK=$(find ${{ runner.temp }}/twa-build -maxdepth 2 -name "app-release-signed.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find ${{ runner.temp }}/twa-build -maxdepth 2 -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK produced by Bubblewrap"
            ls -laR ${{ runner.temp }}/twa-build
            exit 1
          fi
          echo "Found APK: $APK"
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | tail -1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --print-certs "$APK"
          mkdir -p _release
          cp "$APK" "_release/The Legends Online (TWA).apk"
          ls -la _release/

      - name: Update assetlinks.json with current SHA256 (auto-commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/telegram-pwa/public/.well-known
          cat > artifacts/telegram-pwa/public/.well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "social.thelegendsonline.twa",
                "sha256_cert_fingerprints": ["$SHA256_FINGERPRINT"]
              }
            }
          ]
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/telegram-pwa/public/.well-known/assetlinks.json
          if git diff --cached --quiet; then
            echo "assetlinks.json already up to date — no commit needed."
          else
            git commit -m "chore(twa): sync assetlinks.json with keystore fingerprint [skip ci]"
            git push origin HEAD:main
            echo "::notice::assetlinks.json updated and committed. Redeploy thelegendsonline.social to serve the new file."
          fi

      - name: Publish to "twa-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twa-latest
          name: 'TWA APK (latest build)'
          body: |
            **Build TWA (Trusted Web Activity)** — moteur Chrome, pas WebView.

            Charge `https://thelegendsonline.social` en plein écran via Chrome Custom Tab. Comportement de sélection de texte, clavier, viewport et scroll **strictement identiques au site web / PWA**.

            - Package Android : `social.thelegendsonline.twa` (coexiste avec la version Capacitor `social.thelegendsonline.app`)
            - Aucune barre URL si `assetlinks.json` est servi correctement par le domaine
            - Mises à jour automatiques (charge l'URL en live)
            - Build #${{ github.run_number }} · commit ${{ github.sha }}

            Téléchargez ci-dessous et installez sur Android 6.0+. Pour comparer, gardez la version Capacitor installée à côté.
          files: _release/The Legends Online (TWA).apk
          make_latest: 'false'
          prerelease: false
