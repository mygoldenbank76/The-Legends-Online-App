openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: TeleChat messaging PWA API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: conversations
    description: Conversation operations
  - name: messages
    description: Message operations
  - name: reactions
    description: Message reaction operations
  - name: uploads
    description: File upload operations
  - name: contacts
    description: User contacts operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Username taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/count:
    get:
      operationId: getUserCount
      tags: [users]
      summary: Total number of registered users
      description: Returns the live total of registered platform users. Used by the home header live pill.
      responses:
        "200":
          description: Total user count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCount"

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Users found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/status:
    put:
      operationId: updateStatus
      tags: [users]
      summary: Update user online status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List user conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{conversationId}/avatar:
    patch:
      operationId: updateConversationAvatar
      tags: [conversations]
      summary: Set or clear a group conversation avatar (admin only)
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConversationAvatarBody"
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  avatar:
                    type: ["string", "null"]
                required: [avatar]

  /conversations/{conversationId}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: before
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /conversations/{conversationId}/read:
    post:
      operationId: markConversationRead
      tags: [conversations]
      summary: Mark conversation as read
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /messages/{messageId}:
    patch:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditMessageBody"
      responses:
        "200":
          description: Message edited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /messages/{messageId}/pin:
    post:
      operationId: pinMessage
      tags: [messages]
      summary: Pin or unpin a message in its conversation
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pin toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /messages/{messageId}/reactions:
    post:
      operationId: addReaction
      tags: [reactions]
      summary: Add a reaction to a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReactionBody"
      responses:
        "200":
          description: Reaction added or removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /uploads/image:
    post:
      operationId: uploadImage
      tags: [uploads]
      summary: Upload an image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Image uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"

  /contacts:
    get:
      operationId: listContacts
      tags: [contacts]
      summary: List current user's contacts
      responses:
        "200":
          description: Contacts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: addContact
      tags: [contacts]
      summary: Add a contact by username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContactBody"
      responses:
        "200":
          description: Contact already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: Contact added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts/{userId}:
    delete:
      operationId: removeContact
      tags: [contacts]
      summary: Remove a contact
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contact removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    UserCount:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
          description: Total number of registered users on the platform.
      required:
        - count

    RegisterBody:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        password:
          type: string
        avatar:
          type: ["string", "null"]
      required:
        - username
        - displayName
        - password

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        displayName:
          type: string
        avatar:
          type: ["string", "null"]
        isOnline:
          type: boolean
        isAdmin:
          type: boolean
        isBanned:
          type: boolean
        lastSeen:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - username
        - displayName
        - isOnline
        - createdAt

    UpdateStatusBody:
      type: object
      properties:
        isOnline:
          type: boolean
      required:
        - isOnline

    Conversation:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [direct, group, channel]
        name:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
          description: |
            Optional group avatar as a data URL (image/jpeg base64),
            settable only by global admins on group conversations.
        pinnedMessageId:
          type: ["integer", "null"]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/User"
        messageCount:
          type: integer
          description: |
            Total number of messages in this conversation, including
            text, media, GIFs, stickers, polls, voice notes, and
            documents. Telegram WebK-style header counter for groups.
        createdAt:
          type: string
      required:
        - id
        - type
        - participants
        - createdAt

    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [direct, group, channel]
        name:
          type: ["string", "null"]
        avatar:
          type: ["string", "null"]
        pinnedMessageId:
          type: ["integer", "null"]
        otherUser:
          $ref: "#/components/schemas/User"
        lastMessage:
          $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
        messageCount:
          type: integer
          description: Total messages in the conversation (all kinds).
        updatedAt:
          type: string
      required:
        - id
        - type
        - unreadCount
        - updatedAt

    UpdateConversationAvatarBody:
      type: object
      properties:
        avatar:
          type: ["string", "null"]
          description: |
            data:image/* base64 URL (server enforces ~600KB hard cap),
            or null to clear the avatar.
      required:
        - avatar

    CreateConversationBody:
      type: object
      properties:
        userId:
          type: integer
      required:
        - userId

    AlbumItem:
      description: |
        One entry in a multi-attachment album. Either a bare URL string
        (legacy senders) OR a rich object carrying intrinsic dimensions,
        a tiny inline LQIP, and an optional video poster URL — same
        Telegram-style fields the single-image bubble already uses.
      oneOf:
        - type: string
        - type: object
          properties:
            url:
              type: string
            w:
              type: ["integer", "null"]
            h:
              type: ["integer", "null"]
            lqip:
              type: ["string", "null"]
            strippedThumb:
              type: ["string", "null"]
              description: Telegram-format stripped JPEG thumbnail (~150-300 raw bytes, base64-encoded). When present, clients prefer this over `lqip` for the placeholder paint.
            thumbnailUrl:
              type: ["string", "null"]
          required:
            - url

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderId:
          type: integer
        sender:
          $ref: "#/components/schemas/User"
        content:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        mediaWidth:
          type: ["integer", "null"]
        mediaHeight:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        mediaPreview:
          type: ["string", "null"]
          description: Tiny base64 LQIP data URL (~700–1500 B JPEG/PNG/WebP).
        mediaStrippedThumb:
          type: ["string", "null"]
          description: Telegram-format stripped JPEG thumbnail (~150-300 raw bytes, base64-encoded). When present, clients prefer this over `mediaPreview` for the placeholder paint.
        mediaAlbum:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AlbumItem"
        audioUrl:
          type: ["string", "null"]
        audioDuration:
          type: ["integer", "null"]
        linkPreview:
          $ref: "#/components/schemas/LinkPreview"
        replyTo:
          $ref: "#/components/schemas/Message"
        replyToId:
          type: ["integer", "null"]
        forwardedFromName:
          type: ["string", "null"]
          description: When set, the message was forwarded from another conversation; the value is the original sender's display name. Rendered as a "Transféré de [Name]" header inside the bubble (Telegram-WebK style).
        callType:
          type: ["string", "null"]
          enum: ["audio", "video", null]
          description: When set, the message represents a call event (in-app voice/video call). Drives the call bubble + the conversation list preview ("Appel vocal" / "Appel vidéo").
        callStatus:
          type: ["string", "null"]
          enum: ["answered", "missed", "declined", "ongoing", null]
          description: Call lifecycle state. Combined with callType to render the proper preview ("Appel vocal manqué" etc.).
        callDuration:
          type: ["integer", "null"]
          description: Call duration in seconds. Null for missed/declined.
        editedAt:
          type: ["string", "null"]
        isDeleted:
          type: boolean
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        createdAt:
          type: string
      required:
        - id
        - conversationId
        - senderId
        - reactions
        - createdAt
        - isDeleted

    SendMessageBody:
      type: object
      properties:
        content:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        mediaWidth:
          type: ["integer", "null"]
        mediaHeight:
          type: ["integer", "null"]
        thumbnailUrl:
          type: ["string", "null"]
        mediaPreview:
          type: ["string", "null"]
        mediaStrippedThumb:
          type: ["string", "null"]
        mediaAlbum:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/AlbumItem"
        audioUrl:
          type: ["string", "null"]
        audioDuration:
          type: ["integer", "null"]
        replyToId:
          type: ["integer", "null"]
        forwardedFromName:
          type: ["string", "null"]
          description: Set by the in-app Forward sheet to attribute the message to its original sender. Persisted as-is on the new message row.
      required: []

    EditMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    LinkPreview:
      type: object
      properties:
        url:
          type: string
        title:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        platform:
          type: ["string", "null"]
        embedUrl:
          type: ["string", "null"]
        siteName:
          type: ["string", "null"]
        # Telegram-style stripped thumbnail of `image` (base64 wire
        # payload). Painted by the client as a blurred placeholder
        # behind the real og:image so YouTube/Spotify/og cards never
        # flash a grey rectangle while the third-party CDN is contacted.
        imageStrippedThumb:
          type: ["string", "null"]
      required:
        - url

    Reaction:
      type: object
      properties:
        id:
          type: integer
        messageId:
          type: integer
        userId:
          type: integer
        emoji:
          type: string
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
      required:
        - id
        - messageId
        - userId
        - emoji
        - createdAt

    AddReactionBody:
      type: object
      properties:
        emoji:
          type: string
      required:
        - emoji

    UploadResponse:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    AddContactBody:
      type: object
      properties:
        username:
          type: string
      required:
        - username
