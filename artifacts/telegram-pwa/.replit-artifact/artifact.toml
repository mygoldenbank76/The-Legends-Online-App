kind = "web"
previewPath = "/"
title = "TeleChat - Messaging PWA"
version = "1.0.0"
id = "artifacts/telegram-pwa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22768

[services.development]
run = "pnpm --filter @workspace/telegram-pwa run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/telegram-pwa", "run", "build"]

[services.production.build.env]
PORT = "22768"
BASE_PATH = "/"
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/telegram-pwa/server.mjs"]

[services.production.run.env]
PORT = "22768"
NODE_ENV = "production"

[services.env]
PORT = "22768"
BASE_PATH = "/"
