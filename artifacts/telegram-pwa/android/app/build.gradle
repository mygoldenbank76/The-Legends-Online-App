apply plugin: 'com.android.application'

// ─────────────────────────────────────────────────────────────────────────────
// Version code / name come from env vars set by the CI workflow:
//   APP_VERSION_CODE = monotonic build number (github.run_number)
//   APP_VERSION_NAME = "1.0.<build>"
// Falling back to 1 / "1.0" only for ad-hoc local builds. NEVER use sed
// to rewrite this file in CI: that approach silently breaks the day someone
// renames a constant or reformats the line, and it leaves the working tree
// dirty. Reading env vars is robust to refactors and zero side-effects.
// ─────────────────────────────────────────────────────────────────────────────
def appVersionCode = (System.getenv("APP_VERSION_CODE") ?: "1").toInteger()
def appVersionName = System.getenv("APP_VERSION_NAME") ?: "1.0"

android {
    namespace = "social.thelegendsonline.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "social.thelegendsonline.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile != null && !ksFile.isEmpty()) {
                if (!file(ksFile).exists()) {
                    throw new GradleException(
                        "ANDROID_KEYSTORE_FILE is set to '${ksFile}' but the file does not exist. " +
                        "Refusing to produce an unsigned release APK (Play Protect would block install).")
                }
                storeFile file(ksFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                storeType "PKCS12"
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach the signingConfig if we actually have a keystore.
            // If the developer is running a release build WITHOUT a keystore,
            // fail loudly rather than silently producing an APK that Play
            // Protect will reject on every device.
            def ksFile = System.getenv("ANDROID_KEYSTORE_FILE")
            if (ksFile != null && !ksFile.isEmpty()) {
                signingConfig signingConfigs.release
            } else {
                gradle.taskGraph.whenReady { taskGraph ->
                    if (taskGraph.allTasks.any { it.name.toLowerCase().contains("assemblerelease") }) {
                        throw new GradleException(
                            "Release build requested but ANDROID_KEYSTORE_FILE is unset. " +
                            "Set the keystore env vars (or run assembleDebug for local testing).")
                    }
                }
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase BoM + messaging — required by FcmMessagingService.java.
    // The Capacitor PushNotifications plugin pulls Firebase transitively
    // via its own Gradle file, but pinning the BoM here guarantees a
    // single, consistent set of Firebase artefacts in the final APK and
    // gives us a stable surface to override the messaging service.
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    // For MessagingStyle, RemoteInput, NotificationCompat.Action.
    // androidx.core ships them but we make the dependency explicit so a
    // future trim-down of transitives can't silently break notifications.
    implementation 'androidx.core:core:1.13.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
